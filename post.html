<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기록 — Yeonjae</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;family=Nanum+Gothic:wght@400;700&amp;family=Nanum+Myeongjo:wght@400;700&amp;family=Nanum+Pen+Script&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@400;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
<div class="page">
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="index.html">Yeonjae</a>
      <nav class="nav" aria-label="주요 메뉴">
        <a href="index.html#work">작업</a>
        <a href="posts.html" aria-current="page">기록</a>
        <a href="index.html#service">서비스</a>
        <a class="btn btn-dark" href="index.html#request">프로젝트 의뢰</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="article" style="padding-top: 72px">
      <div style="display: flex; flex-direction: column; gap: 20px">
        <a href="posts.html" style="font-size: 14px; color: var(--gray-600); text-decoration: none">← 기록으로</a>
        <p id="post-status" role="status" style="margin: 0; color: var(--gray-600)">글을 불러오는 중…</p>
        <span id="post-cat" style="font-size: 13px; color: var(--blue); font-weight: 700"></span>
        <h1 id="post-title"></h1>
        <div class="meta" id="post-meta" hidden><span>Yeonjae</span><span aria-hidden="true">·</span><span id="post-date"></span><span id="admin-slot" style="margin-left: auto"></span></div>
      </div>
      <p id="draft-note" class="notice notice-info" style="margin-top: 24px" hidden></p>
      <figure id="post-cover-wrap" style="margin: 32px 0 0" hidden><img id="post-cover" alt="" style="display: block; width: 100%; max-height: 440px; object-fit: cover; background: var(--surface)"></figure>
      <div id="post-body" class="prose"></div>
      <div id="post-tags" class="tags"></div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© Yeonjae</span>
      <div class="links"><a href="#">Instagram</a><a href="#">Behance</a><a href="admin/login.html?next=posts.html">관리자</a></div>
    </div>
  </footer>
</div>
<script type="module" src="js/post.js"></script>
</body>
</html>
