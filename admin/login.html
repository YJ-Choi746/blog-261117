<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>관리자 로그인 — Jae</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/site.css">
<link rel="stylesheet" href="../css/fx.css">
<style>
.login { min-height: 100vh; display: flex; flex-wrap: wrap; }
.login-side { flex: 1 1 420px; min-height: 320px; background: var(--blue); color: var(--white); padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; }
.login-side a { color: var(--white); }
.login-side p { margin: 0; font-family: var(--font-serif); font-weight: 600; font-size: clamp(36px, 4.4vw, 60px); line-height: 1.2; }
.login-main { flex: 1 1 480px; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
.login-form { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; }
.login-form h1 { margin: 0; font-family: var(--font-serif); font-size: 34px; }
.pw { display: flex; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--radius-field); padding-right: 4px; }
.pw .input { border: 0; }
.pw .input:focus-visible { outline: none; }
.pw:focus-within { outline: 2px solid var(--blue); outline-offset: 2px; }
.toggle { flex: none; white-space: nowrap; min-height: var(--touch-min); padding: 0 14px; border: 0; background: transparent; color: var(--blue-tint-ink); font-size: 14px; font-weight: 500; line-height: 1; display: inline-flex; align-items: center; cursor: pointer; }
.toggle:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="login">
  <section class="login-side" aria-hidden="true">
    <span class="logo">Jae</span>
    <p>오늘은 무엇을<br>기록할까요?</p>
    <span style="font-size: 14px">관리자 전용 페이지</span>
  </section>

  <main class="login-main">
    <form id="login-form" class="login-form" novalidate>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1>관리자 로그인</h1>
        <p style="margin: 0; color: var(--gray-600)">글을 쓰려면 관리자 계정으로 로그인하세요.</p>
      </div>
      <p id="config-notice" class="notice notice-info" hidden>Firebase 설정이 아직 없어서 로그인할 수 없어요. <code>js/firebase-config.js</code>에 설정값을 넣어 주세요 (docs/FIREBASE_SETUP.md).</p>
      <label class="field" for="email">이메일
        <input class="input" id="email" name="email" type="email" autocomplete="username" required placeholder="you@example.com">
      </label>
      <label class="field" for="password">비밀번호
        <span class="pw">
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required placeholder="비밀번호">
          <button type="button" id="toggle-pw" class="toggle" aria-controls="password" aria-pressed="false">보기</button>
        </span>
      </label>
      <p id="login-error" class="notice notice-error" role="alert" hidden></p>
      <button type="submit" id="login-btn" class="btn btn-dark" style="min-height: 54px">로그인</button>
      <a href="../index.html" style="align-self: center; font-size: 14px; color: var(--gray-600)">← 블로그로 돌아가기</a>
    </form>
  </main>
</div>
<script type="module" src="../js/login.js"></script>
</body>
</html>
