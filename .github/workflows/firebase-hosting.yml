# main 브랜치에 올리면 Firebase Hosting(https://jae-design.web.app · 이전 주소 blog---261117.web.app도 같은 내용)에도 자동 배포해요.
# 필요한 것: GitHub 저장소 Settings → Secrets and variables → Actions 에
#   FIREBASE_SERVICE_ACCOUNT 라는 이름으로 서비스 계정 키(JSON)를 넣어야 해요. (docs/FIREBASE_SETUP.md 참고)
name: Deploy to Firebase Hosting

# 글마다 카카오톡 · SNS 공유 미리보기 페이지(p/글ID.html)도 여기서 만들어요.
# 새 글을 발행하면 늦어도 1시간 안에(매시 17분) 다시 만들어 올려요. 바로 원하면 Actions에서 Run workflow.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 글마다 공유 미리보기 페이지 만들기
        run: node .github/scripts/share-pages.mjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: blog---261117
