# main 브랜치에 올리면 Firebase Hosting(https://blog---261117.web.app)에도 자동 배포해요.
# 필요한 것: GitHub 저장소 Settings → Secrets and variables → Actions 에
#   FIREBASE_SERVICE_ACCOUNT 라는 이름으로 서비스 계정 키(JSON)를 넣어야 해요. (docs/firebase-setup.md 참고)
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: blog---261117
